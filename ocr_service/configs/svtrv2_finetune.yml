# Reference fine-tune config for SVTRv2 + GTCDecoder(SMTRDecoder + RCTCDecoder).
# ocr_service renders this shape per training run (see docs/ocr_training_plan.md
# §3.4); keep it in sync with the template the service generates.
#
# Paths are relative to ocr_service/, but character_dict_path is relative to
# OpenOCR/ because train_rec.py is launched with that as its cwd. Anything
# reading the config from elsewhere must resolve it (see
# export_smtr_onnx.py::_absolutize_dict_paths).
#
# Three settings here are load-bearing and were established by measurement, not
# preference — read the plan before changing them:
#   main_indicator: min_acc   'acc' is the CTC head ALONE, so best-checkpoint
#                             selection would ignore the SMTR head and can save
#                             a run at epoch 2 with gtc_acc 0.52 (§3.9).
#   use_space_char: True      Labels keep their spaces: exact-match 0.43 -> 0.93
#                             at no measurable cost in character accuracy (§3.8).
#                             Needs a vocab-expanded base ckpt (expand_ckpt_vocab.py).
#   epoch_num: 50             With space on, best_epoch lands around 18 — don't
#                             drop below ~30.
Global:
  device: gpu
  epoch_num: 50
  log_smooth_window: 20
  print_batch_step: 10
  output_dir: ./output/finetune
  save_epoch_step: [1, 10]
  eval_batch_step: [0, 500]
  eval_epoch_step: [0, 1]
  cal_metric_during_train: True
  pretrained_model: ./weights/base/svtrv2_datecode_2406.pth
  checkpoints:
  use_tensorboard: false
  infer_img:
  character_dict_path: &character_dict_path ./tools/utils/EN_symbol_dict.txt
  max_text_length: &max_text_length 25
  use_space_char: &use_space_char True
  save_res_path: ./output/finetune/predicts.txt
  use_amp: True

Optimizer:
  name: AdamW
  lr: 0.0001
  weight_decay: 0.05
  filter_bias_and_bn: True

LRScheduler:
  name: OneCycleLR
  warmup_epoch: 1.5
  cycle_momentum: False

Architecture:
  model_type: rec
  algorithm: SVTRv2
  in_channels: 3
  Transform:
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: False
    dims: [128, 256, 384]
    depths: [6, 6, 6]
    num_heads: [4, 8, 12]
    mixer: [['Conv','Conv','Conv','Conv','Conv','Conv'],['Conv','Conv','FGlobal','Global','Global','Global'],['Global','Global','Global','Global','Global','Global']]
    local_k: [[5, 5], [5, 5], [-1, -1]]
    sub_k: [[1, 1], [2, 1], [-1, -1]]
    last_stage: false
    feat2d: True
  Decoder:
    name: GTCDecoder
    infer_gtc: True
    detach: False
    gtc_decoder:
      name: SMTRDecoder
      num_layer: 1
      ds: True
      max_len: *max_text_length
      next_mode: &next True
      sub_str_len: &subsl 5
    ctc_decoder:
      name: RCTCDecoder

Loss:
  name: GTCLoss
  ctc_weight: 0.1
  gtc_loss:
    name: SMTRLoss

PostProcess:
  name: GTCLabelDecode
  gtc_label_decode:
    name: SMTRLabelDecode
    next_mode: *next
  character_dict_path: *character_dict_path
  use_space_char: *use_space_char

Metric:
  name: RecGTCMetric
  main_indicator: min_acc
  is_filter: True

Train:
  dataset:
    name: SimpleDataSet
    data_dir: ./data_ocr_merged
    label_file_list: ["./data_ocr_merged/rec_gt_train.txt"]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - PARSeqAugPIL:
      - RecTVResize:
          image_shape: [32, 128]
          padding: False
      - GTCLabelEncode:
          gtc_label_encode:
            name: SMTRLabelEncode
            sub_str_len: *subsl
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'label_subs', 'label_next', 'length_subs',
          'label_subs_pre', 'label_next_pre', 'length_subs_pre', 'length', 'ctc_label', 'ctc_length']
  loader:
    shuffle: True
    batch_size_per_card: 32
    drop_last: True
    num_workers: 2

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: ./data_ocr_merged
    label_file_list: ["./data_ocr_merged/rec_gt_test.txt"]
    transforms:
      - DecodeImagePIL:
          img_mode: RGB
      - RecTVResize:
          image_shape: [32, 128]
          padding: False
      - GTCLabelEncode:
          gtc_label_encode:
            name: ARLabelEncode
          character_dict_path: *character_dict_path
          use_space_char: *use_space_char
          max_text_length: *max_text_length
      - KeepKeys:
          keep_keys: ['image', 'label', 'length', 'ctc_label', 'ctc_length']
  loader:
    shuffle: False
    drop_last: False
    batch_size_per_card: 32
    num_workers: 2
