<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Service — Test UI</title>
<style>
  /* Palette lấy theo frontend-ts/src/styles/{RecipeFormModal,ConfirmDialog}.css */
  :root{
    --bg:#f9fafb; --card:#fff; --border:#e5e7eb; --border-2:#d1d5db;
    --text:#111827; --text-2:#374151; --muted:#6b7280; --muted-2:#9ca3af;
    --primary:#3b82f6; --primary-h:#2563eb; --primary-soft:rgba(59,130,246,.1);
    --purple:#8b5cf6; --purple-soft:rgba(139,92,246,.1);
    --danger:#ef4444; --danger-soft:#fee2e2; --ok:#10b981;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font-family:'Segoe UI',system-ui,-apple-system,sans-serif;font-size:15px}
  .wrap{max-width:1080px;margin:0 auto;padding:20px;display:grid;
        grid-template-columns:300px 1fr;gap:20px;align-items:start}
  @media(max-width:860px){.wrap{grid-template-columns:1fr}}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;
        box-shadow:0 20px 60px rgba(0,0,0,.06);overflow:hidden}
  .card h2{margin:0;padding:14px 16px;font-size:15px;font-weight:600;
           border-bottom:1px solid var(--border);background:#fff}
  .pad{padding:16px}

  label{display:block;font-size:12px;font-weight:600;color:var(--muted);
        margin:12px 0 5px;text-transform:uppercase;letter-spacing:.03em}
  label:first-child{margin-top:0}
  input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--border-2);
        border-radius:8px;font:inherit;font-size:14px;background:#fff;color:var(--text)}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);
        box-shadow:0 0 0 3px var(--primary-soft)}

  button{font:inherit;font-size:14px;border-radius:8px;cursor:pointer;
         border:1px solid transparent;padding:9px 14px;transition:.12s}
  button:disabled{opacity:.5;cursor:not-allowed}
  .btn{background:var(--primary);color:#fff;width:100%;font-weight:600}
  .btn:hover:not(:disabled){background:var(--primary-h)}
  .btn-ghost{background:#fff;border-color:var(--border-2);color:var(--text-2)}
  .btn-ghost:hover:not(:disabled){background:#f3f4f6}
  .row{display:flex;gap:8px;margin-top:10px}
  .row>*{flex:1}

  .stat{display:flex;justify-content:space-between;align-items:center;
        padding:7px 0;font-size:13px;border-bottom:1px dashed var(--border)}
  .stat:last-child{border-bottom:0}
  .stat span:first-child{color:var(--muted)}
  .stat b{font-weight:600;font-family:ui-monospace,Menlo,monospace;font-size:12px}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
  .dot.on{background:var(--ok)} .dot.off{background:var(--danger)}

  /* ── chat ─────────────────────────────────────────────── */
  #log{height:calc(100vh - 300px);min-height:380px;overflow-y:auto;padding:16px;
       background:var(--bg);display:flex;flex-direction:column;gap:14px}
  .msg{max-width:82%;padding:12px 15px;border-radius:14px;line-height:1.6;
       word-break:break-word;font-size:14px}
  .msg.me{align-self:flex-end;background:var(--primary);color:#fff;
          border-bottom-right-radius:4px;white-space:pre-wrap}
  .msg.bot{align-self:flex-start;background:#fff;border:1px solid var(--border);
           border-bottom-left-radius:4px}
  .msg.err{align-self:stretch;background:var(--danger-soft);border:1px solid #fca5a5;
           color:#991b1b;max-width:100%;font-size:13px;white-space:pre-wrap}

  /* khối markdown bên trong bong bóng bot */
  .msg>*:first-child{margin-top:0} .msg>*:last-child{margin-bottom:0}
  .msg p{margin:0 0 10px}
  .msg h3,.msg h4,.msg h5,.msg h6{margin:16px 0 8px;font-size:14.5px;font-weight:700;
        color:var(--text);line-height:1.4}
  .msg h3{font-size:15.5px;padding-bottom:5px;border-bottom:1px solid var(--border)}
  .msg ul,.msg ol{margin:0 0 10px;padding-left:22px}
  .msg li{margin:4px 0}
  .msg li>ul,.msg li>ol{margin:4px 0}
  .msg hr{border:0;border-top:1px solid var(--border);margin:14px 0}
  .msg code{background:#f3f4f6;padding:1.5px 5px;border-radius:4px;
            font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
  .msg pre{background:#f3f4f6;padding:11px 13px;border-radius:8px;overflow-x:auto;
           margin:0 0 10px;line-height:1.5}
  .msg pre code{background:none;padding:0;font-size:12.5px}
  .msg.me code,.msg.me pre{background:rgba(255,255,255,.2)}

  /* bảng phải cuộn ngang trong khung của nó, không đẩy tràn cả trang */
  .tw{overflow-x:auto;margin:0 0 10px;border:1px solid var(--border);border-radius:8px}
  .msg table{border-collapse:collapse;width:100%;font-size:13px}
  .msg th,.msg td{padding:7px 11px;text-align:left;border-bottom:1px solid var(--border);
                  white-space:nowrap}
  .msg th{background:#f9fafb;font-weight:600;color:var(--text-2);font-size:12px;
          text-transform:uppercase;letter-spacing:.03em}
  .msg tbody tr:last-child td{border-bottom:0}
  .msg tbody tr:hover{background:#f9fafb}

  /* ── biểu đồ cột ngang (SVG thuần, không thư viện) ───── */
  .viz{align-self:flex-start;max-width:82%;width:520px;background:#fff;
       border:1px solid var(--border);border-radius:12px;padding:14px 16px}
  .viz-title{font-size:12.5px;font-weight:700;color:var(--text-2);margin-bottom:12px}
  .bar-row{display:grid;grid-template-columns:110px 1fr auto;gap:10px;
           align-items:center;margin-bottom:9px;font-size:12.5px}
  .bar-row:last-child{margin-bottom:0}
  .bar-lab{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{background:#f3f4f6;border-radius:5px;height:20px;overflow:hidden}
  .bar-fill{height:100%;background:var(--primary);border-radius:5px;
            transition:width .35s ease}
  .bar-fill.hot{background:var(--danger)}
  .bar-val{font-weight:700;font-variant-numeric:tabular-nums;min-width:56px;
           text-align:right;color:var(--text)}
  .bar-sub{grid-column:2/4;font-size:11px;color:var(--muted-2);margin-top:-5px}

  /* ── ảnh ─────────────────────────────────────────────── */
  .shots{align-self:flex-start;max-width:82%;display:grid;
         grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .shot{background:#fff;border:1px solid var(--border);border-radius:10px;
        overflow:hidden;cursor:zoom-in;transition:.12s}
  .shot:hover{border-color:var(--primary);transform:translateY(-1px)}
  .shot img{width:100%;height:110px;object-fit:cover;display:block;background:#f3f4f6}
  .shot figcaption{padding:7px 9px;font-size:10.5px;color:var(--muted);line-height:1.45}
  .shot .bad{color:var(--danger);font-weight:600}

  #lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;
      align-items:center;justify-content:center;z-index:99;padding:24px;cursor:zoom-out}
  #lb.on{display:flex;flex-direction:column;gap:12px}
  #lb img{max-width:96vw;max-height:84vh;object-fit:contain;border-radius:8px}
  #lb div{color:#fff;font-size:13px;text-align:center}

  .meta{align-self:flex-start;display:flex;flex-wrap:wrap;gap:6px;margin-top:-8px}
  .tool{font-size:11px;font-family:ui-monospace,Menlo,monospace;color:var(--purple);
        background:var(--purple-soft);padding:3px 8px;border-radius:6px}

  .group{align-self:flex-start;max-width:100%}
  .group-label{font-size:11px;font-weight:700;color:var(--muted);
               text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}

  /* options = bắt buộc chọn → viền đậm hơn */
  .opt{background:#fff;border:1.5px solid var(--primary);color:var(--primary-h);
       text-align:left;font-weight:600;display:flex;flex-direction:column;
       align-items:flex-start;gap:2px;padding:8px 12px}
  .opt:hover:not(:disabled){background:var(--primary-soft)}
  .opt small{font-weight:400;color:var(--muted);font-size:11.5px}
  /* suggestions = tuỳ chọn → nhạt hơn */
  .sug{background:#fff;border:1px solid var(--border-2);color:var(--text-2);
       border-radius:999px;padding:7px 13px;font-size:13px}
  .sug:hover:not(:disabled){border-color:var(--primary);color:var(--primary-h)}

  .composer{display:flex;gap:8px;padding:14px 16px;border-top:1px solid var(--border);
            background:#fff}
  .composer textarea{flex:1;resize:none;height:42px;max-height:120px;padding:10px 12px}
  .composer button{padding:0 22px;background:var(--primary);color:#fff;font-weight:600}
  .composer button:hover:not(:disabled){background:var(--primary-h)}

  .preset{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .preset button{font-size:12px;padding:5px 10px;background:#fff;
                 border:1px solid var(--border-2);color:var(--muted);border-radius:6px;
                 width:auto;flex:none;text-align:left}
  .preset button:hover{border-color:var(--primary);color:var(--primary-h)}

  details{margin-top:12px;font-size:12px}
  summary{cursor:pointer;color:var(--muted);user-select:none}
  pre.raw{background:#f3f4f6;padding:10px;border-radius:8px;overflow-x:auto;
          font-size:11px;max-height:260px;margin-top:8px;line-height:1.5}
  .hint{font-size:11.5px;color:var(--muted-2);margin-top:6px;line-height:1.5}

  /* ── Thẻ người thao tác ──
     Dùng biến CSS của chính trang (--card, --border, --text…) chứ không đặt màu
     cứng: trang này là theme sáng, mà bản đầu tôi viết màu tối nên thẻ nổi bật
     lên như của một giao diện khác. */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin:10px 0 4px}
  .card-p{border:1px solid var(--border);border-radius:12px;background:var(--card);
          overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card-p.off{opacity:.6}
  .card-hd{display:flex;align-items:center;gap:11px;padding:12px 13px;
           border-bottom:1px solid var(--border)}
  .card-av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;
           border:2px solid var(--border-2);background:var(--bg)}
  .card-av.ph{display:flex;align-items:center;justify-content:center;font-size:21px;
              font-weight:700;color:var(--muted-2)}
  .card-id{flex:1;min-width:0}
  .card-t{font-size:14px;font-weight:650;color:var(--text);white-space:nowrap;
          overflow:hidden;text-overflow:ellipsis}
  .card-role{font-size:12px;color:var(--text-2);margin:2px 0 1px;white-space:nowrap;
             overflow:hidden;text-overflow:ellipsis}
  .card-s{font-size:11px;color:var(--muted-2);font-family:ui-monospace,monospace}
  .card-b{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
          letter-spacing:.04em;padding:2px 8px;border-radius:99px;margin-top:5px;
          background:var(--primary-soft);color:var(--primary-h)}
  .card-b.sup{background:var(--purple-soft);color:var(--purple)}
  .card-b.adm{background:var(--danger-soft);color:#b91c1c}
  .card-n{text-align:right;flex-shrink:0}
  .card-n b{display:block;font-size:20px;color:var(--primary-h);line-height:1}
  .card-n small{font-size:10px;color:var(--muted)}
  .card-bd{padding:9px 13px 11px;display:flex;flex-direction:column;gap:5px}
  .card-row{display:flex;justify-content:space-between;gap:12px;font-size:12px;line-height:1.45}
  .card-row span{color:var(--muted);flex-shrink:0}
  .card-row b{color:var(--text-2);font-weight:500;text-align:right;word-break:break-word}

  /* ── Ô KPI ── */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px;margin:10px 0 4px}
  .kpi{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:11px 13px}
  .kpi-l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .kpi-v{font-size:23px;font-weight:700;line-height:1.15;margin-top:3px;color:var(--text);
         font-variant-numeric:tabular-nums}
  .kpi-v.ok{color:var(--ok)} .kpi-v.bad{color:var(--danger)}
  .kpi-d{font-size:12px;font-weight:600;margin-top:2px;color:var(--muted)}
  .kpi-d.g{color:var(--ok)} .kpi-d.b{color:var(--danger)}
  .kpi-s{font-size:10px;color:var(--muted-2);margin-top:2px}

  /* ── Bảng dữ liệu ── */
  .tbl-wrap{margin:10px 0 4px}
  .tbl-t{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:6px}
  /* Bảng so sánh có 8 cột; cho cuộn ngang trong khung riêng chứ không để cả
     trang chat bị kéo ngang theo. */
  .tbl-scroll{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--card)}
  .tbl{width:100%;border-collapse:collapse;font-size:12px}
  .tbl th{background:var(--bg);color:var(--text-2);font-weight:700;font-size:10px;
          text-transform:uppercase;letter-spacing:.04em;padding:7px 10px;
          border-bottom:1px solid var(--border);white-space:nowrap}
  .tbl td{padding:6px 10px;border-bottom:1px solid var(--border);color:var(--text-2);
          font-variant-numeric:tabular-nums;white-space:nowrap}
  .tbl tbody tr:last-child td{border-bottom:none}
  .tbl tbody tr:nth-child(even) td{background:var(--bg)}

  .kpi-r{font-weight:500;color:var(--muted)}
  .kpi-p{font-size:10px;color:var(--muted-2);margin-top:1px;font-variant-numeric:tabular-nums}
  .tbl-c{font-size:10px;color:var(--muted-2);margin:-2px 0 6px}
  .tbl-scroll{position:relative}
  /* Vệt mờ rìa phải khi còn cột chưa thấy */
  .tbl-scroll.more::after{content:'';position:sticky;right:0;top:0;float:right;width:26px;height:100%;
    background:linear-gradient(to right,transparent,var(--card));pointer-events:none}
  .tbl td:first-child{white-space:normal;max-width:190px}

  /* Dạng thẻ thay cho bảng rộng khi khung hẹp. Ngưỡng 720px vì khung chat còn
     hẹp hơn bề rộng cửa sổ (cột trái chiếm 300px + gap). */
  .tbl-cards{display:none}
  @media(max-width:720px){
    /* Chỉ ẩn bảng khi CÓ bản thẻ thay thế. Ẩn vô điều kiện thì bảng dưới 5 cột —
       như "các lần dừng" (Từ / Đến / Số phút) — không có gì thay thế và biến mất
       hoàn toàn trên điện thoại. */
    .tbl-wrap.has-cards .tbl-scroll{display:none}
    .tbl-wrap.has-cards .tbl-cards{display:flex;flex-direction:column;gap:8px}
  }
  .tbl-card{border:1px solid var(--border);border-radius:10px;background:var(--card);overflow:hidden}
  .tbl-card-h{font-size:13px;font-weight:600;color:var(--text);padding:8px 11px;
              background:var(--bg);border-bottom:1px solid var(--border)}
  .tbl-card-r{display:flex;justify-content:space-between;gap:12px;font-size:12px;
              padding:4px 11px;line-height:1.45}
  .tbl-card-r:last-child{padding-bottom:8px}
  .tbl-card-r span{color:var(--muted);flex-shrink:0}
  .tbl-card-r b{color:var(--text-2);font-weight:500;text-align:right;
                font-variant-numeric:tabular-nums;word-break:break-word}

  .viz-ref{font-size:10px;color:var(--muted);text-align:right;margin:-4px 0 6px}
</style>
</head>
<body>
<div id="lb" onclick="this.className=''"></div>
<div class="wrap">

  <!-- ══════ CỘT TRÁI ══════ -->
  <div>
    <div class="card">
      <h2>Kết nối</h2>
      <div class="pad">
        <label>Agent service</label>
        <input id="agUrl">

        <label>Tài khoản</label>
        <input id="user" placeholder="username" autocomplete="username">
        <input id="pass" type="password" placeholder="password"
               autocomplete="current-password" style="margin-top:8px"
               onkeydown="if(event.key==='Enter')login()">
        <button class="btn" style="margin-top:12px" onclick="login()">Đăng nhập</button>

        <div style="margin-top:14px">
          <div class="stat"><span>Token</span><b id="stTok">—</b></div>
          <div class="stat"><span>Agent service</span><b id="stAg">—</b></div>
          <div class="stat"><span>Backend :8000</span><b id="stBe">—</b></div>
          <div class="stat"><span>Agents</span><b id="stN">—</b></div>
        </div>
      </div>
    </div>

    <div class="card" style="margin-top:20px">
      <h2>Phiên chat</h2>
      <div class="pad">
        <label>Agent</label>
        <select id="agent">
          <option value="orchestrator">orchestrator (tự định tuyến)</option>
          <option value="historical_analytics">historical_analytics</option>
          <option value="service_management">service_management</option>
          <option value="log_analysis">log_analysis</option>
        </select>
        <label>Session ID</label>
        <input id="sid">
        <div class="row">
          <button class="btn-ghost" onclick="newSession()">Session mới</button>
          <button class="btn-ghost" onclick="clearConv()">Xoá lịch sử</button>
        </div>
        <p class="hint">Cùng session = agent nhớ ngữ cảnh. Đổi session để test lại từ đầu.</p>
      </div>
    </div>
  </div>

  <!-- ══════ CỘT PHẢI ══════ -->
  <div class="card">
    <h2>Chat</h2>
    <div id="log"></div>

    <div class="composer">
      <textarea id="inp" placeholder="Nhập câu hỏi…  (Enter gửi, Shift+Enter xuống dòng)"
                onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
      <button id="btnSend" onclick="send()">Gửi</button>
    </div>

    <div class="pad" style="border-top:1px solid var(--border);padding-top:12px">
      <div class="group-label">Câu hỏi mẫu — bấm để test nhanh</div>
      <div class="preset" id="presets"></div>
      <details>
        <summary>Response JSON của lượt gần nhất</summary>
        <pre class="raw" id="raw">(chưa có)</pre>
      </details>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let TOKEN = null, BUSY = false;

const PRESETS = [
  ['Hôm nay sản xuất bao nhiêu?',        'tổng dây chuyền — KHÔNG hỏi lại'],
  ['Pass rate minced onion hôm nay?',    'tên mơ hồ → hiện options'],
  ['Thống kê pass/fail theo recipe',     'chưa nêu recipe → list_recipes'],
  ['Camera nào fail nhiều nhất hôm nay?','camera breakdown'],
  ['Xu hướng pass rate 7 ngày qua',      'trend theo ngày'],
  ['Camera service khoẻ không?',         'service_management'],
  ['Xem 5 dòng log cuối',                'tail log 654MB'],
  ['Ai load recipe gần đây nhất?',       'lịch sử recipe'],
  ['Từ 16h đến 18h camera nào fail nhiều nhất?', 'lọc theo KHUNG GIỜ'],
  ['Tại sao sản phẩm bị fail hôm nay?',  'explain_failures — nguyên nhân'],
  ['Hôm nay hệ thống có lỗi gì không?',  'log_analysis — gom nhóm ERROR/WARNING'],
  ['Lúc 5 giờ sáng có chuyện gì?',       'log_analysis — lọc theo khung giờ'],
  ['Tìm trong log xem có cảnh báo GPU không?', 'log_analysis — search_logs'],
  ['Ai đã thao tác gì trên hệ thống hôm nay?', 'log_analysis — audit log MongoDB'],
  ['Log chiếm bao nhiêu dung lượng?',    'log_analysis — file ngoài chính sách dọn'],
];

// Public URL dùng khi mở trang bằng file:// (lúc đó location.origin là "null").
const PUBLIC_URL = 'https://audiobook.a.pinggy.link';

// Mặc định là CHÍNH origin đang phục vụ trang. Nhờ vậy một file chạy được ở cả
// http://localhost:8100/test lẫn https://audiobook.a.pinggy.link/test mà không
// phải sửa gì. Quan trọng hơn: qua tunnel trang chạy HTTPS, nếu hardcode
// http://localhost:8100 thì trình duyệt chặn thẳng vì mixed content.
$('agUrl').value = location.protocol.startsWith('http') ? location.origin : PUBLIC_URL;

const agUrl = () => $('agUrl').value.replace(/\/+$/,'');

function newSession(){
  $('sid').value = 'test-' + Math.random().toString(36).slice(2,8);
  $('log').innerHTML = '';
  note('Session mới: ' + $('sid').value);
}

// ── render ────────────────────────────────────────────────
function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

// Định dạng trong dòng
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
}

// Dựng danh sách lồng nhau. Phải đệ quy: <ul> con bắt buộc nằm TRONG <li> cha,
// đặt thành anh em của <li> là HTML sai và trình duyệt thụt lề lệch.
// Trả [html, chỉ số phần tử kế tiếp].
function renderList(items, start, depth){
  const ordered = /\d/.test(items[start].marker);
  let html = ordered ? '<ol>' : '<ul>';
  let i = start;
  while(i < items.length && items[i].depth >= depth){
    if(items[i].depth > depth){
      const [sub, next] = renderList(items, i, items[i].depth);
      // gắn danh sách con vào trong <li> vừa đóng ngay phía trên
      html = html.replace(/<\/li>$/, sub + '</li>');
      i = next;
      continue;
    }
    html += `<li>${inline(items[i].text)}</li>`;
    i++;
  }
  html += ordered ? '</ol>' : '</ul>';
  return [html, i];
}

// Renderer markdown theo KHỐI. Bản trước chỉ xử lý **đậm** và ```code```, nên
// tiêu đề ###, danh sách "- ", và nhất là BẢNG markdown (agent hay xuất bảng
// so sánh camera) đều hiện ra dạng ký tự thô dính liền nhau.
function md(src){
  const L = String(src).replace(/\r/g,'').split('\n');
  const out = [];
  let i = 0;

  const isTableRow = s => /^\s*\|.*\|\s*$/.test(s);
  const cells = s => s.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());

  while(i < L.length){
    const line = L[i];

    // ```code```
    if(/^\s*```/.test(line)){
      const buf = [];
      i++;
      while(i < L.length && !/^\s*```/.test(L[i])) buf.push(L[i++]);
      i++;
      out.push(`<pre><code>${esc(buf.join('\n'))}</code></pre>`);
      continue;
    }

    // | bảng | có | dòng phân cách |
    if(isTableRow(line) && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||'')){
      const head = cells(line);
      i += 2;
      const rows = [];
      while(i < L.length && isTableRow(L[i])) rows.push(cells(L[i++]));
      out.push(
        '<div class="tw"><table><thead><tr>' +
        head.map(h=>`<th>${inline(h)}</th>`).join('') +
        '</tr></thead><tbody>' +
        rows.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('') +
        '</tbody></table></div>'
      );
      continue;
    }

    // # tiêu đề. Trong bong bóng chat không có h1/h2, nên ### (mức LLM hay
    // dùng nhất cho tiêu đề mục) phải ra h3 — mức có style nổi bật nhất.
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length <= 3 ? 3 : 4; out.push(`<h${n}>${inline(h[2])}</h${n}>`); i++; continue; }

    // --- đường kẻ
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){ out.push('<hr>'); i++; continue; }

    // danh sách: "- x" hoặc "1. x", giữ cả cấp lồng theo thụt đầu dòng
    if(/^(\s*)([-*•]|\d+[.)])\s+/.test(line)){
      const buf = [];
      while(i < L.length){
        const m = L[i].match(/^(\s*)([-*•]|\d+[.)])\s+(.*)$/);
        if(!m) break;
        buf.push({depth: Math.floor(m[1].length/2), marker: m[2], text: m[3]});
        i++;
      }
      out.push(renderList(buf, 0, buf[0].depth)[0]);
      continue;
    }

    // dòng trống
    if(!line.trim()){ i++; continue; }

    // đoạn văn — gộp các dòng liền nhau, xuống dòng đơn giữ nguyên bằng <br>
    const para = [];
    while(i < L.length && L[i].trim() && !/^\s*```/.test(L[i])
          && !/^(#{1,6})\s/.test(L[i]) && !/^(\s*)([-*•]|\d+[.)])\s/.test(L[i])
          && !isTableRow(L[i])){
      para.push(L[i++]);
    }
    out.push(`<p>${para.map(inline).join('<br>')}</p>`);
  }
  return out.join('');
}

function bubble(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = cls === 'bot' ? md(text) : esc(text);
  $('log').appendChild(d);
  scroll();
  return d;
}
function note(t){ const d=bubble(t,'bot'); d.style.opacity=.6; d.style.fontSize='12.5px'; }
function scroll(){ $('log').scrollTop = $('log').scrollHeight; }

// Biểu đồ cột ngang. Số liệu do backend suy tất định từ kết quả tool nên luôn
// khớp con số trong câu trả lời — ở đây chỉ vẽ, không tính toán lại.
function drawKpis(list){
  const box = document.createElement('div'); box.className='kpis';
  list.forEach(k=>{
    const el = document.createElement('div'); el.className='kpi';
    let d = '';
    if(k.delta && k.delta.text){
      // Không vẽ mũi tên trơ: khi không có nền so sánh, `delta` vắng hẳn nên
      // khối này không chạy. Trước đây mũi tên vẫn hiện kèm chuỗi rỗng — bốn ô
      // với bốn mũi tên xanh/đỏ không con số nào, chỉ vào một kỳ không có dữ liệu.
      const dir = k.delta.direction;
      const arrow = dir==='flat' ? '→' : (dir==='up' ? '▲' : '▼');
      const cls = dir==='flat' ? '' : (k.delta.good ? 'g' : 'b');
      const rel = k.delta.rel ? ` <span class="kpi-r">(${esc(k.delta.rel)})</span>` : '';
      d = `<div class="kpi-d ${cls}">${arrow} ${esc(k.delta.text)}${rel}</div>`;
    }
    const prev = (k.delta && k.delta.previous!=null)
      ? `<div class="kpi-p">trước: ${esc(String(k.delta.previous))}</div>` : '';
    el.innerHTML = `<div class="kpi-l">${esc(k.label)}</div>
                    <div class="kpi-v ${k.accent||''}">${esc(String(k.value))}</div>
                    ${d}${prev}${k.sub?`<div class="kpi-s">${esc(k.sub)}</div>`:''}`;
    box.appendChild(el);
  });
  $('log').appendChild(box);
}

function drawTable(t){
  const wrap = document.createElement('div'); wrap.className='tbl-wrap';
  const al = i => ({l:'left',r:'right',c:'center'}[(t.align||[])[i]] || 'left');
  // esc() gọi String() ở mọi chỗ: nó dùng s.replace nên một tiêu đề cột dạng số
  // sẽ ném TypeError, và lỗi đó thoát ra khỏi send() làm mất luôn phần vẽ còn
  // lại của cả câu trả lời.
  const S = v => esc(String(v==null?'':v));
  const cols = t.columns || [], rows = t.rows || [];

  const head = `${t.title?`<div class="tbl-t">${S(t.title)}</div>`:''}
                ${t.caption?`<div class="tbl-c">${S(t.caption)}</div>`:''}`;

  // Bảng rộng (từ 5 cột) đổi sang dạng THẺ khi khung hẹp.
  //
  // Bảng 8 cột đo được 760–1295px; trong khung chat ~688px trên màn hình lớn và
  // ~300px trên điện thoại thì chỉ hiện 1-2 cột đầu — tức toàn số của KỲ TRƯỚC —
  // mà không có dấu hiệu nào cho biết còn cột nữa. Người xem đọc số kỳ trước
  // thành số kỳ này. Cuộn ngang không cứu được: thứ bị che lại là cột quyết định.
  const stacked = cols.length >= 5 ? `
    <div class="tbl-cards">${rows.map(r=>`
      <div class="tbl-card">
        <div class="tbl-card-h">${S(r[0])}</div>
        ${r.slice(1).map((v,i)=> String(v??'').trim()==='' ? '' :
          `<div class="tbl-card-r"><span>${S(cols[i+1])}</span><b>${S(v)}</b></div>`).join('')}
      </div>`).join('')}</div>` : '';

  if (stacked) wrap.classList.add('has-cards');
  wrap.innerHTML = head + `
    <div class="tbl-scroll"><table class="tbl">
      <thead><tr>${cols.map((c,i)=>`<th style="text-align:${al(i)}">${S(c)}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${r.map((v,i)=>
        `<td style="text-align:${al(i)}">${S(v)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>` + stacked;
  $('log').appendChild(wrap);

  // Bảng hẹp (dưới 5 cột) vẫn dùng cuộn ngang; bật vệt mờ khi còn cột chưa thấy.
  const sc = wrap.querySelector('.tbl-scroll');
  const sync = () => sc.classList.toggle('more', sc.scrollWidth - sc.clientWidth - sc.scrollLeft > 4);
  sc.addEventListener('scroll', sync); requestAnimationFrame(sync);
}

function drawCards(cards){
  // Thẻ người thao tác. Ảnh trỏ vào /api/uploads/avatar/... do agent service
  // mount thẳng backend/uploads, nên không phụ thuộc backend :8000 còn sống.
  const wrap = document.createElement('div'); wrap.className = 'cards';
  cards.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'card-p' + (c.inactive ? ' off' : '');
    const av = c.avatar
      ? `<img class="card-av" src="${esc(c.avatar)}" alt="" loading="lazy"
              onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'card-av ph',textContent:'?'}))">`
      : `<div class="card-av ph">${esc((c.title||'?').slice(0,1).toUpperCase())}</div>`;
    const rows = (c.rows||[]).map(r=>
      `<div class="card-row"><span>${esc(r[0])}</span><b>${esc(String(r[1]))}</b></div>`).join('');
    el.innerHTML = `
      <div class="card-hd">
        ${av}
        <div class="card-id">
          <div class="card-t">${esc(c.title||'')}</div>
          ${c.role_line?`<div class="card-role">${esc(c.role_line)}</div>`:''}
          <div class="card-s">${esc(c.subtitle||'')}</div>
          <span class="card-b ${c.badge_role==='admin'?'adm':c.badge_role==='supervisor'?'sup':''}"
              title="Mức phân quyền trong phần mềm — khác với chức vụ ở dòng trên">${esc(c.badge||'')}</span>
        </div>
        ${c.stat!=null?`<div class="card-n" title="Số bản ghi audit log của người này trong kỳ đang xem"><b>${esc(String(c.stat))}</b><small>${esc(c.stat_label||'')}</small></div>`:''}
      </div>
      ${rows?`<div class="card-bd">${rows}</div>`:''}`;
    wrap.appendChild(el);
  });
  $('log').appendChild(wrap);
}

function drawFiles(files){
  // File báo cáo do generate_report sinh ra. Mở tab mới thay vì <a download>:
  // trang này có thể đang xem qua tunnel, và với HTML/PDF thì xem trực tiếp
  // tiện hơn tải về rồi mới mở.
  const box = document.createElement('div'); box.className = 'chips';
  box.style.margin = '6px 0 2px';
  files.forEach(f=>{
    const a = document.createElement('a');
    a.className = 'opt';
    a.href = agUrl() + f.url;
    a.target = '_blank';
    a.rel = 'noopener';
    a.style.textDecoration = 'none';
    a.innerHTML = `⬇ ${esc(f.label || f.filename)}<small>${esc(f.meta || f.filename)}</small>`;
    box.appendChild(a);
  });
  $('log').appendChild(box);
}

function drawChart(c){
  // `c.max` là thang đo cố định do phía server đặt (ví dụ chỉ tiêu sản lượng).
  // Không có nó thì lấy cột lớn nhất — nhưng khi so với một mốc thì cách đó làm
  // cột cuối luôn đầy track và mọi ngày đều trông như đã hoàn thành.
  const max = c.max || Math.max(...c.series.map(s=>s.value), 1);
  const box = document.createElement('div');
  box.className = 'viz';
  const refLine = c.ref ? `<div class="viz-ref">▏${esc(c.ref.label)}</div>` : '';
  box.innerHTML = `<div class="viz-title">${esc(c.title)}</div>${refLine}` + c.series.map(s=>{
    const pct = (s.value / max) * 100;
    // Cột cao nhất tô đỏ khi đang đếm lỗi — mắt bắt ngay thủ phạm.
    const hot = c.unit !== '%' && s.value === max && max > 0 ? ' hot' : '';
    const val = c.unit === '%' ? s.value + '%' : s.value.toLocaleString('vi-VN');
    return `<div class="bar-row">
        <div class="bar-lab" title="${esc(s.label)}">${esc(s.label)}</div>
        <div class="bar-track"><div class="bar-fill${hot}" style="width:${pct}%"></div></div>
        <div class="bar-val">${val}</div>
      </div>` + (s.sub ? `<div class="bar-sub">${esc(s.sub)}</div>` : '');
  }).join('');
  $('log').appendChild(box); scroll();
}

function drawImages(list){
  const g = document.createElement('div'); g.className = 'shots';
  list.forEach(im=>{
    const fig = document.createElement('figure'); fig.className = 'shot';
    const cap = esc(im.caption).replace(/→ đọc '([^']*)'/, "→ đọc <span class='bad'>'$1'</span>");
    fig.innerHTML = `<img src="${esc(im.url)}" alt="" loading="lazy"
                          onerror="this.style.opacity=.25;this.alt='không tải được'">
                     <figcaption>${cap}</figcaption>`;
    fig.onclick = ()=>lightbox(im);
    g.appendChild(fig);
  });
  $('log').appendChild(g); scroll();
}

function lightbox(im){
  const lb = $('lb');
  lb.innerHTML = `<img src="${esc(im.url)}"><div>${esc(im.caption)}</div>`;
  lb.className = 'on';
}

function chipGroup(label, items, render){
  const g = document.createElement('div'); g.className = 'group';
  g.innerHTML = `<div class="group-label">${label}</div>`;
  const box = document.createElement('div'); box.className = 'chips';
  items.forEach(it => box.appendChild(render(it, g)));
  g.appendChild(box); $('log').appendChild(g); scroll();
}

// ── API ───────────────────────────────────────────────────
async function login(){
  try{
    const r = await fetch(agUrl()+'/api/auth/login', {
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({username:$('user').value, password:$('pass').value})
    });
    const j = await r.json();
    if(!r.ok || !j.access_token) throw new Error(j.detail || 'Đăng nhập thất bại');
    TOKEN = j.access_token;
    $('stTok').innerHTML = '<span class="dot on"></span>ok';
    note(`Đăng nhập thành công — ${j.user.username} (${j.user.role}). Token do chính agent service cấp, không cần backend :8000.`);
    health();
  }catch(e){
    $('stTok').innerHTML = '<span class="dot off"></span>lỗi';
    bubble('Đăng nhập lỗi: ' + e.message, 'err');
  }
}

async function health(){
  try{
    const j = await (await fetch(agUrl()+'/api/agent/health')).json();
    $('stAg').innerHTML = `<span class="dot ${j.status==='healthy'?'on':'off'}"></span>${j.status}`;
    $('stBe').innerHTML = `<span class="dot ${j.backend_reachable?'on':'off'}"></span>${j.backend_reachable?'ok':'không tới được'}`;
    $('stN').textContent = j.agents_registered;
  }catch(e){
    $('stAg').innerHTML = '<span class="dot off"></span>không tới được';
  }
}

async function clearConv(){
  if(!TOKEN) return bubble('Chưa đăng nhập.','err');
  await fetch(`${agUrl()}/api/agent/conversation/${$('sid').value}`,
              {method:'DELETE', headers:{Authorization:'Bearer '+TOKEN}});
  $('log').innerHTML=''; note('Đã xoá lịch sử của session này.');
}

async function send(text){
  const msg = (text ?? $('inp').value).trim();
  if(!msg || BUSY) return;
  if(!TOKEN) return bubble('Chưa đăng nhập — bấm "Đăng nhập" ở cột trái.','err');

  $('inp').value=''; bubble(msg,'me');
  BUSY = true; $('btnSend').disabled = true;
  const wait = bubble('đang xử lý…','bot'); wait.style.opacity=.5;

  try{
    const r = await fetch(agUrl()+'/api/agent/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json', Authorization:'Bearer '+TOKEN},
      body:JSON.stringify({message:msg, agent_id:$('agent').value, session_id:$('sid').value})
    });
    const j = await r.json();
    wait.remove();
    $('raw').textContent = JSON.stringify(j, null, 2);
    if(!r.ok) throw new Error(j.detail || ('HTTP '+r.status));

    bubble(j.response, 'bot');

    if(j.kpis?.length) drawKpis(j.kpis);
    if(j.charts?.length) j.charts.forEach(drawChart);
    if(j.images?.length) drawImages(j.images);
    if(j.cards?.length) drawCards(j.cards);
    if(j.tables?.length) j.tables.forEach(drawTable);
    if(j.files?.length) drawFiles(j.files);

    if(j.tool_calls?.length){
      const m = document.createElement('div'); m.className='meta';
      m.innerHTML = j.tool_calls
        .map(t=>`<span class="tool">${esc(t.tool)}(${esc(JSON.stringify(t.args))})</span>`).join('');
      $('log').appendChild(m);
    }

    // options: BẮT BUỘC chọn — disable cả nhóm sau khi bấm
    if(j.options?.length){
      chipGroup('Chọn một', j.options, (o,g)=>{
        const b = document.createElement('button');
        b.className='opt';
        b.innerHTML = `${esc(o.label)}${o.hint?`<small>${esc(o.hint)}</small>`:''}`;
        b.onclick = ()=>{ g.querySelectorAll('button').forEach(x=>x.disabled=true); send(o.value); };
        return b;
      });
    }
    // suggestions: tuỳ chọn
    if(j.suggestions?.length){
      chipGroup('Gợi ý', j.suggestions, s=>{
        const b = document.createElement('button');
        b.className='sug'; b.textContent = s;
        b.onclick = ()=>send(s);
        return b;
      });
    }
  }catch(e){
    wait.remove();
    bubble('Lỗi: ' + e.message, 'err');
  }finally{
    BUSY=false; $('btnSend').disabled=false; $('inp').focus();
  }
}

// ── init ──────────────────────────────────────────────────
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('lb').className=''; });

PRESETS.forEach(([q,why])=>{
  const b=document.createElement('button');
  b.textContent=q; b.title=why;
  b.onclick=()=>send(q);
  $('presets').appendChild(b);
});
newSession();
health();
note('Bấm "Đăng nhập" để bắt đầu. Câu hỏi mẫu ở dưới — di chuột vào để xem nó test cái gì.');
</script>
