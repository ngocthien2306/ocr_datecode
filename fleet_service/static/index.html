<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet — OCR Datecode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>

<header class="topbar">
  <span class="brand">Fleet — OCR Datecode</span>
  <span class="chip-note" id="no-login"></span>
  <div class="tally" id="tally"></div>
  <span class="spacer"></span>
  <span id="stale"></span>
  <span class="clock" id="clock"></span>
  <div class="seg">
    <button id="btn-light" title="Light">☀</button>
    <button id="btn-dark" title="Dark">☾</button>
  </div>
  <div class="seg">
    <button id="btn-en">EN</button>
    <button id="btn-vi">VI</button>
  </div>
  <button id="btn-refresh"></button>
</header>

<div class="wrap">

  <!-- Fold đầu: sơ đồ + lưới thẻ máy. Không cuộn — đây là câu hỏi đầu ca. -->
  <section class="fold">
    <div class="panel">
      <div class="panel-head">
        <h2 id="floor-title"></h2>
        <span class="hint" id="floor-hint"></span>
      </div>
      <div class="map-body" id="map"></div>
      <div class="map-legend" id="map-legend"></div>
    </div>

    <div>
      <div class="panel-head" style="padding-left:2px;padding-right:2px;border:0">
        <h2 id="mach-title"></h2>
        <span class="hint" id="mach-hint"></span>
      </div>
      <div class="grid" id="grid"></div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button id="tab-overview" role="tab" aria-selected="true"></button>
    <button id="tab-staff" role="tab" aria-selected="false"></button>
    <button id="tab-log" role="tab" aria-selected="false"></button>
  </nav>

  <!-- Tổng quan -->
  <section id="pane-overview" role="tabpanel">
    <div class="panel">
      <div class="panel-head">
        <h2 id="stats-title"></h2>
        <span class="spacer"></span>
        <div class="seg">
          <button id="v-chart">▤</button>
          <button id="v-table">☰</button>
        </div>
        <button id="btn-export"></button>
      </div>
      <div id="stats-body"></div>
    </div>
    <div id="fingerprint"></div>
    <div class="panel" style="margin-top:14px">
      <div class="panel-head"><h2 id="fail-title"></h2></div>
      <div id="fail-body"></div>
    </div>
  </section>

  <!-- Nhân sự -->
  <section id="pane-staff" role="tabpanel" hidden>
    <div class="panel">
      <div class="filters">
        <div class="seg">
          <button id="g-machine"></button>
          <button id="g-dept"></button>
          <button id="g-shift"></button>
        </div>
        <input id="f-q" type="search">
        <select id="f-machine"></select>
        <select id="f-dept"></select>
        <select id="f-shift"></select>
        <select id="f-role"></select>
      </div>
      <div id="staff-body"></div>
    </div>
  </section>

  <!-- Nhật ký: hai phần trong một tab, KHÔNG trộn một dòng thời gian -->
  <section id="pane-log" role="tabpanel" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2 id="log-users-title"></h2>
        <span class="spacer"></span>
        <label style="font-size:12px;color:var(--dim);display:flex;gap:6px;align-items:center">
          <input type="checkbox" id="sim-toggle"><span id="sim-label"></span>
        </label>
      </div>
      <div id="log-users"></div>
    </div>
    <div class="panel" style="margin-top:14px">
      <div class="panel-head"><h2 id="log-sys-title"></h2></div>
      <div id="log-sys"></div>
    </div>
  </section>
</div>

<aside class="drawer" id="drawer"></aside>

<div id="chat" class="min">
  <header>
    <b id="chat-title"></b>
    <span class="hint" id="chat-hint" style="font-size:11px;color:var(--faint)"></span>
    <span class="spacer"></span><span id="chat-caret">▲</span>
  </header>
  <div id="log"></div>
  <div class="ctxchip" id="ctxchip"></div>
  <div class="chips" id="chips"></div>
  <form id="ask">
    <input id="q" autocomplete="off">
    <button type="submit" id="btn-send"></button>
  </form>
</div>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
