seed: 42
device: auto
data:
  root: /home/ngocthien.ai/ocr_datecode/data/dataset_v3/output2
  image_size: 64
  val_ratio: 0.15
  min_per_class: 4
  task: multi_128
  include_ng: true
  num_workers: 2
augment:
  preset: minimal
model:
  backbone: efficientnet_b3
  pretrained: true
  head:
    type: arcface
    out_dim: 2
    hidden: 512
    margin: 0.3
    scale: 30.0
loss:
  type: arcface
  class_weights: auto
  label_smoothing: 0.05
  gamma: 2.0
  poly_eps: 2.0
  center_alpha: 0.5
  center_lambda: 0.005
  temperature: 0.07
train:
  batch_size: 128
  epochs: 10
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 2
  use_two_view: false
  sampler: per_class
  per_class_n_classes: 16
  per_class_n_samples: 4
  amp: true
  grad_clip: 1.0
eval:
  primary_metric: balanced_score
  threshold_sweep: true
  inference: argmax
output:
  base_dir: runs
  save_artifacts:
  - pt
  - onnx
  - csv
  export_onnx: true
  onnx_opset: 17
experiment_name: arcface_128_b3
