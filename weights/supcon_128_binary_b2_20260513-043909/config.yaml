seed: 42
device: cuda
data:
  root: /root/nguyen/ocr_datecode/data/output2
  image_size: 64
  val_ratio: 0.15
  min_per_class: 4
  task: binary
  include_ng: true
  num_workers: 2
augment:
  preset: medium
model:
  backbone: efficientnet_b2
  pretrained: true
  head:
    type: projection
    out_dim: 128
    hidden: 512
    margin: 0.3
    scale: 30.0
loss:
  type: supcon
  class_weights: auto
  label_smoothing: 0.05
  gamma: 2.0
  poly_eps: 2.0
  center_alpha: 0.5
  center_lambda: 0.005
  temperature: 0.07
train:
  batch_size: 256
  epochs: 10
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.0001
  scheduler: cosine
  warmup_epochs: 2
  use_two_view: true
  sampler: per_class
  per_class_n_classes: 2
  per_class_n_samples: 64
  amp: true
  grad_clip: 1.0
eval:
  primary_metric: balanced_score
  threshold_sweep: true
  inference: nearest_centroid
output:
  base_dir: runs
  save_artifacts:
  - pt
  - onnx
  - csv
  export_onnx: true
  onnx_opset: 17
experiment_name: supcon_128_binary_b2
