services:
  # ============================================
  # MongoDB Database
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: ocr-mongodb
    restart: unless-stopped
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-password}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ocr-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache (Optional)
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ocr-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - ocr-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # Backend API
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.ubuntu
      network: host
    container_name: ocr-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # MongoDB
      MONGODB_URL: mongodb://${MONGODB_USERNAME:-admin}:${MONGODB_PASSWORD:-password}@mongodb:27017/
      DATABASE_NAME: ${DATABASE_NAME:-ocr_datecode_db}

      # Redis
      REDIS_URL: redis://redis:6379
      REDIS_CACHE_TTL_RECENT: ${REDIS_CACHE_TTL_RECENT:-60}
      REDIS_CACHE_TTL_HISTORICAL: ${REDIS_CACHE_TTL_HISTORICAL:-300}

      # JWT
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-43200}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000","http://localhost:5173","http://localhost:80"]}

      # Application
      APP_NAME: ${APP_NAME:-OCR Datecode API}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: ${DEBUG:-False}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      TIMEZONE: ${TIMEZONE:-Asia/Ho_Chi_Minh}

      # Storage Paths (inside container)
      BACKEND_BASE_PATH: /app
      UPLOADS_BASE_PATH: /app/uploads
      INFERENCE_RESULTS_PATH: /app/uploads/inference_results
      SAVE_FRAME_PATH: /app/uploads/save_frame
      TEMPLATE_UPLOAD_PATH: /app/uploads/templates
      TEMPLATE_VISUALIZE_PATH: /app/uploads/visualizations
      AVATAR_UPLOAD_PATH: /app/uploads/avatar
      LOGS_PATH: /app/logs
      CAMERA_SETTINGS_PATH: /app/camera_settings
      INFERENCE_STATE_PATH: /app/inference_state

      # AI Services (will be mounted as volume)
      AI_SERVICES_PATH: /ai_services
      CAMERA_SCRIPT_PATH: /ai_services/camera_shm_producer.py

      # Image Processing
      FRAME_SAVE_QUALITY: ${FRAME_SAVE_QUALITY:-95}

      # Trigger
      TRIGGER_FILE_PATH: /tmp

      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/logs:/app/logs
      - ./backend/camera_settings:/app/camera_settings
      - ./backend/inference_state:/app/inference_state
      - ./ai_services:/ai_services:ro  # Read-only mount
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ocr-network

  # ============================================
  # Frontend Web App
  # ============================================
  frontend:
    build:
      context: ./frontend-ts
      dockerfile: Dockerfile
      network: host
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000}
    container_name: ocr-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    networks:
      - ocr-network

  # ============================================
  # Mongo Express (Optional - Database Admin UI)
  # ============================================
  mongo-express:
    image: mongo-express:latest
    container_name: ocr-mongo-express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGODB_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGODB_PASSWORD:-password}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGODB_USERNAME:-admin}:${MONGODB_PASSWORD:-password}@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_BASICAUTH_PASSWORD:-admin123}
    depends_on:
      - mongodb
    networks:
      - ocr-network
    profiles:
      - admin  # Only start when using --profile admin

# ============================================
# Volumes
# ============================================
volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  ocr-network:
    driver: bridge
